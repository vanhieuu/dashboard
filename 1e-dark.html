<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueSky - Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#ffffff;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:#0B72AE}a:hover{color:#063E62}
  #stage{position:fixed;top:50%;left:50%;width:430px;height:932px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--s,1));background:#ffffff;overflow:hidden}
  .ui{position:absolute;inset:0;display:flex;flex-direction:column;padding:52px 32px 32px}
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 300 640" width="430" height="932" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;display:block">
<defs><linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#063E62"/><stop offset="0.42" stop-color="#0B72AE"/><stop offset="0.78" stop-color="#6FC6EE"/><stop offset="1" stop-color="#D6EEF9"/></linearGradient><radialGradient id="a-sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0.5" stop-color="#FFD166" stop-opacity="0.9"/><stop offset="1" stop-color="#FFD166" stop-opacity="0"/></radialGradient></defs>
<rect width="300" height="640" fill="url(#a-sky)"/>
<circle cx="228" cy="150" r="86" fill="url(#a-sun)"/><circle cx="228" cy="150" r="30" fill="#FFE29A"/>
<circle cx="46" cy="86" r="2.6" fill="#fff" opacity="0.85"/><circle cx="88" cy="52" r="1.8" fill="#fff" opacity="0.6"/><circle cx="140" cy="98" r="2" fill="#fff" opacity="0.5"/><circle cx="262" cy="62" r="2.2" fill="#fff" opacity="0.7"/>
<g fill="#ffffff" opacity="0.28"><ellipse cx="70" cy="250" rx="40" ry="26"/><ellipse cx="106" cy="256" rx="30" ry="20"/><ellipse cx="40" cy="262" rx="26" ry="17"/><rect x="34" y="252" width="86" height="18" rx="9"/></g>
<g fill="#ffffff" opacity="0.5"><ellipse cx="222" cy="330" rx="46" ry="28"/><ellipse cx="184" cy="340" rx="30" ry="20"/><ellipse cx="258" cy="342" rx="26" ry="17"/><rect x="176" y="336" width="106" height="20" rx="10"/></g>
<g fill="#ffffff" opacity="0.9"><ellipse cx="104" cy="452" rx="56" ry="34"/><ellipse cx="58" cy="466" rx="34" ry="23"/><ellipse cx="152" cy="466" rx="32" ry="22"/><rect x="46" y="460" width="140" height="26" rx="13"/></g>
<path d="M0,520 C48,494 92,548 148,528 C206,507 246,556 300,536 L300,640 L0,640 Z" fill="#EAF6FD"/>
<path d="M0,556 C56,532 96,580 156,562 C214,544 252,586 300,570 L300,640 L0,640 Z" fill="#FFFFFF"/>
</svg>
<div class="ui" style="align-items:center;justify-content:center;gap:24px">
<div style="width:109px;height:109px;border-radius:32px;background:#fff;box-shadow:0 11.5px 34.5px rgba(6,62,98,.28);display:flex;align-items:center;justify-content:center"><span style="font:800 44px/50px 'Baloo 2',sans-serif;color:#0B72AE">B</span></div>
<div style="font:800 44px/50px 'Baloo 2',sans-serif;color:#fff;letter-spacing:.5px">BlueSky</div>
<div style="font:700 21px/28px 'Be Vietnam Pro',sans-serif;color:rgba(255,255,255,.85)">Bầu trời trong tầm tay</div>
</div></div>
<script>
(function(){var st=document.getElementById("stage");function fit(){st.style.setProperty("--s",Math.min(innerWidth/430,innerHeight/932));}fit();addEventListener("resize",fit);addEventListener("orientationchange",fit);})();
</script>
</body>
</html>
