<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueRise - Chưa có đơn xin nghỉ</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@keyframes ab-glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}
@keyframes ab-drift{0%{transform:translateX(-9px)}100%{transform:translateX(13px)}}
@keyframes ab-spin{to{transform:rotate(360deg)}}
@keyframes ab-bar{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes ab-caret{0%,45%{opacity:1}55%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B72AE;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:#0B72AE}a:hover{color:#063E62}
/* /absence · empty — khung thiết kế 430x932, scale contain để vừa mọi màn hình */
#stage{position:fixed;top:50%;left:50%;width:430px;height:932px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--s,1))}
#stage > div{border-radius:0 !important;box-shadow:none !important;height:932px !important}
</style>
</head>
<body>
<div id="stage">
<div style="position:relative;width:430px;height:932px;border-radius:38px;overflow:hidden;background:#F4FAFD;box-shadow:0 24px 60px rgba(6,62,98,.22);display:flex;flex-direction:column">
<div style="position:relative;height:214px;flex-shrink:0;overflow:hidden;background:#0B72AE">
<svg viewBox="0 0 430 214" preserveAspectRatio="xMidYMin slice" style="position:absolute;inset:0;width:100%;height:100%;display:block">
<defs><linearGradient id="a2-g" x1="0" y1="0" x2="0.65" y2="1"><stop offset="0" stop-color="#063E62"/><stop offset="0.6" stop-color="#0B72AE"/><stop offset="1" stop-color="#37AEE2"/></linearGradient><radialGradient id="a2-s" cx="0.5" cy="0.5" r="0.5"><stop offset="0.34" stop-color="#FFE9AE" stop-opacity="0.5"/><stop offset="1" stop-color="#FFE9AE" stop-opacity="0"/></radialGradient></defs>
<rect width="430" height="214" fill="url(#a2-g)"/>
<circle cx="384" cy="76" r="66" fill="url(#a2-s)" style="animation:ab-glow 5.4s ease-in-out infinite"/>
<circle cx="384" cy="76" r="22" fill="#FFF3CF"/>
<g fill="#fff" opacity="0.08" style="animation:ab-drift 17s ease-in-out infinite alternate"><ellipse cx="104" cy="150" rx="44" ry="26"/><ellipse cx="66" cy="160" rx="28" ry="18"/><rect x="60" y="154" width="114" height="21" rx="10.5"/></g>
</svg>
<div style="position:relative;z-index:1;padding:52px 24px 0">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:40px;height:40px;border-radius:16px;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.36);display:flex;align-items:center;justify-content:center;font:800 15px/22px 'Baloo 2',sans-serif;color:#fff;flex-shrink:0">MA</div>
<div style="flex:1;min-width:0">
<div style="font:500 11px/16px 'Be Vietnam Pro',sans-serif;color:rgba(255,255,255,.72)">Đơn của</div>
<div style="display:flex;align-items:center;gap:8px"><span style="font:700 15px/22px 'Baloo 2',sans-serif;color:#fff">Nguyễn Minh Anh</span><i class="fa-solid fa-chevron-down" style="font-size:11px;color:rgba(255,255,255,.7);line-height:1"></i></div>
</div>
</div>
<div style="font:800 26px/32px 'Baloo 2',sans-serif;color:#fff;margin-top:16px;line-height:32px">Xin nghỉ phép</div>
</div>
</div>

<div style="flex:1;margin-top:-32px;border-radius:32px 32px 0 0;background:#F4FAFD;padding:24px 24px 0;position:relative;z-index:2;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(6,62,98,.1)">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px 32px">
<svg viewBox="0 0 120 108" width="150" height="135">
<rect x="24" y="14" width="72" height="80" rx="12" fill="#fff" stroke="#DDEAF3" stroke-width="2"/>
<rect x="36" y="30" width="48" height="6" rx="3" fill="#DDEAF3"/>
<rect x="36" y="44" width="34" height="6" rx="3" fill="#EDF4F9"/>
<rect x="36" y="58" width="42" height="6" rx="3" fill="#EDF4F9"/>
<circle cx="86" cy="80" r="20" fill="#FFF3CF"/>
<circle cx="86" cy="80" r="20" fill="none" stroke="#FFD166" stroke-width="2.5"/>
<path d="M78 80 l6 6 l11 -13" stroke="#0B72AE" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#CBDFEC"><ellipse cx="26" cy="100" rx="16" ry="5"/></g>
</svg>
<div style="font:800 21px/28px 'Baloo 2',sans-serif;color:#0B3B58">Chưa có đơn xin nghỉ</div>
<div style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488;text-align:center">Các đơn bạn tạo sẽ xuất hiện tại đây. Con đang đi học đầy đủ — tiếp tục giữ nhịp nhé!</div>
<div style="margin-top:8px;height:56px;padding:0 24px;border-radius:16px;background:#0B72AE;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px/22px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #085A8B;cursor:pointer" style-active="transform:translateY(4px);box-shadow:0 0 0 #085A8B"><i class="fa-solid fa-circle-plus" style="font-size:15px;line-height:1"></i>Tạo đơn xin nghỉ</div>
</div>
</div>

<div style="position:relative;z-index:3;height:80px;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:0 -8px 24px rgba(6,62,98,.09)">

<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:16px;min-width:52px;cursor:pointer;background:transparent;color:#8AA3B4">
<i class="fa-solid fa-house" style="font-size:21px;line-height:1"></i>
<span style="font:700 11px/16px 'Be Vietnam Pro',sans-serif">Trang chủ</span>
</div>


<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:16px;min-width:52px;cursor:pointer;background:transparent;color:#8AA3B4">
<i class="fa-solid fa-newspaper" style="font-size:21px;line-height:1"></i>
<span style="font:700 11px/16px 'Be Vietnam Pro',sans-serif">Bản tin</span>
</div>


<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:16px;min-width:52px;cursor:pointer;background:#EAF6FD;color:#0B72AE">
<i class="fa-solid fa-calendar-xmark" style="font-size:21px;line-height:1"></i>
<span style="font:700 11px/16px 'Be Vietnam Pro',sans-serif">Xin nghỉ</span>
</div>


<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:16px;min-width:52px;cursor:pointer;background:transparent;color:#8AA3B4">
<i class="fa-solid fa-comment-dots" style="font-size:21px;line-height:1"></i>
<span style="font:700 11px/16px 'Be Vietnam Pro',sans-serif">Góp ý</span>
</div>


<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:16px;min-width:52px;cursor:pointer;background:transparent;color:#8AA3B4">
<i class="fa-solid fa-envelope" style="font-size:21px;line-height:1"></i>
<span style="font:700 11px/16px 'Be Vietnam Pro',sans-serif">Tin nhắn</span>
</div>

</div>
</div>
</div>
<script>
(function(){
  var st = document.getElementById('stage');
  function fit(){ st.style.setProperty('--s', Math.min(innerWidth/430, innerHeight/932)); }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
})();
</script>
</body>
</html>
