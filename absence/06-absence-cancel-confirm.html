<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueRise - Xác nhận huỷ đơn</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@keyframes ab-glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}
@keyframes ab-drift{0%{transform:translateX(-9px)}100%{transform:translateX(13px)}}
@keyframes ab-spin{to{transform:rotate(360deg)}}
@keyframes ab-bar{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes ab-caret{0%,45%{opacity:1}55%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B72AE;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:#0B72AE}a:hover{color:#063E62}
/* /absence/[id] — khung thiết kế 430x932, scale contain để vừa mọi màn hình */
#stage{position:fixed;top:50%;left:50%;width:430px;height:932px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--s,1))}
#stage > div{border-radius:0 !important;box-shadow:none !important;height:932px !important}
</style>
</head>
<body>
<div id="stage">
<div style="position:relative;width:430px;height:932px;border-radius:38px;overflow:hidden;background:#F4FAFD;box-shadow:0 24px 60px rgba(6,62,98,.22);display:flex;flex-direction:column">
<div style="position:absolute;inset:0;background:#0B72AE;opacity:.14"></div>
<div style="position:relative;height:216px;flex-shrink:0;overflow:hidden;background:#0B72AE">
<svg viewBox="0 0 430 216" preserveAspectRatio="xMidYMin slice" style="position:absolute;inset:0;width:100%;height:100%;display:block">
<defs><linearGradient id="a6-g" x1="0" y1="0" x2="0.65" y2="1"><stop offset="0" stop-color="#063E62"/><stop offset="0.6" stop-color="#0B72AE"/><stop offset="1" stop-color="#37AEE2"/></linearGradient></defs>
<rect width="430" height="216" fill="url(#a6-g)"/>
<circle cx="390" cy="62" r="20" fill="#FFF3CF" opacity="0.5"/>
</svg>
<div style="position:relative;z-index:1;padding:52px 24px 0;opacity:.55">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:40px;height:40px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;line-height:22px"><i class="fa-solid fa-arrow-left"></i></div>
<div style="font:700 17px/24px 'Baloo 2',sans-serif;color:#fff">Chi tiết đơn</div>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:16px">
<span style="font:700 21px/28px ui-monospace,Menlo,monospace;color:#fff">AB-2607-018</span>
<span style="font:700 11px/16px 'Be Vietnam Pro',sans-serif;padding:4px 12px;border-radius:24px;background:#FFD166;color:#5A3D00">Chờ duyệt</span>
</div>
</div>
</div>
<div style="flex:1;margin-top:-32px;border-radius:32px 32px 0 0;background:#F4FAFD;padding:24px 24px 0;position:relative;z-index:2;opacity:.45;overflow:hidden">
<div style="padding:16px;border-radius:24px;background:#fff;box-shadow:0 3px 0 #DDEAF3">
<div style="height:11px;width:46%;border-radius:8px;background:#DDEAF3"></div>
<div style="height:11px;width:72%;border-radius:8px;background:#EDF4F9;margin-top:12px"></div>
<div style="height:11px;width:60%;border-radius:8px;background:#EDF4F9;margin-top:12px"></div>
</div>
<div style="margin-top:16px;padding:16px;border-radius:24px;background:#fff;box-shadow:0 3px 0 #DDEAF3">
<div style="height:11px;width:56%;border-radius:8px;background:#DDEAF3"></div>
<div style="height:11px;width:38%;border-radius:8px;background:#EDF4F9;margin-top:12px"></div>
</div>
</div>

<div style="position:absolute;inset:0;background:rgba(6,40,62,.5);z-index:10"></div>
<div style="position:absolute;left:0;right:0;bottom:0;z-index:11;background:#fff;border-radius:32px 32px 0 0;padding:12px 24px 32px;display:flex;flex-direction:column;align-items:center">
<div style="width:42px;height:5px;border-radius:4px;background:#DCEBF4;margin-bottom:24px"></div>
<div style="width:66px;height:66px;border-radius:24px;background:#FFF1EF;display:flex;align-items:center;justify-content:center;font-size:26px;color:#EF5B4C;line-height:32px"><i class="fa-solid fa-circle-xmark"></i></div>
<div style="font:800 21px/28px 'Baloo 2',sans-serif;color:#0B3B58;margin-top:16px;text-align:center">Huỷ đơn xin nghỉ?</div>
<div style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488;text-align:center;margin-top:8px">Đơn <b style="color:#0B3B58;font-weight:700">AB-2607-018</b> cho 3 buổi từ 28/07 đến 30/07 sẽ bị huỷ. Bạn không thể hoàn tác, nhưng có thể tạo đơn mới bất cứ lúc nào.</div>
<div style="width:100%;margin-top:24px;padding:12px 16px;border-radius:16px;background:#F4FAFD;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488"><span>Toán nâng cao</span><span style="font-weight:700;color:#0B3B58">2 buổi</span></div>
<div style="display:flex;justify-content:space-between;font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488"><span>Vật lý 8</span><span style="font-weight:700;color:#0B3B58">1 buổi</span></div>
</div>
<div style="width:100%;margin-top:24px;height:58px;border-radius:16px;background:#EF5B4C;color:#fff;display:flex;align-items:center;justify-content:center;font:700 17px/24px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #C7473A;cursor:pointer" style-active="transform:translateY(4px);box-shadow:0 0 0 #C7473A">Huỷ đơn</div>
<div style="width:100%;margin-top:12px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font:700 15px/22px 'Baloo 2',sans-serif;color:#5A7488;cursor:pointer">Giữ đơn</div>
</div>
</div>
</div>
<script>
(function(){
  var st = document.getElementById('stage');
  function fit(){ st.style.setProperty('--s', Math.min(innerWidth/430, innerHeight/932)); }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
})();
</script>
</body>
</html>
