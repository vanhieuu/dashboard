name: Deploy staged Home Code Map dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-home-code-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Home Code Map from staged package
        shell: bash
        run: |
          set -euo pipefail
          files=(
            assets/home-code-map-exact/part-001.b64
            assets/home-code-map-exact/part-002.b64
            assets/home-code-map-exact/part-003.b64
            assets/home-code-map-exact/part-004.b64
            assets/home-code-map-exact/part-005.b64
            assets/home-code-map-exact/part-006.b64
            assets/home-code-map-exact/part-007.b64
            assets/home-code-map-exact/rest-001.b64
          )
          for f in "${files[@]}"; do test -s "$f"; done
          cat "${files[@]}" | tr -d '\r\n ' | base64 -d > /tmp/home-code-map.gz
          gzip -t /tmp/home-code-map.gz
          gzip -dc /tmp/home-code-map.gz > /tmp/dashboard.new.html
          test "$(wc -c < /tmp/dashboard.new.html)" -gt 100000
          grep -qi '<!DOCTYPE html' /tmp/dashboard.new.html
          grep -qi '<html' /tmp/dashboard.new.html
          grep -qi '<script' /tmp/dashboard.new.html
          echo "rebuilt bytes: $(wc -c < /tmp/dashboard.new.html)"
          echo "rebuilt sha256: $(sha256sum /tmp/dashboard.new.html | cut -d' ' -f1)"
          mv /tmp/dashboard.new.html dashboard.html

      - name: Commit dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          if git diff --cached --quiet; then
            echo 'dashboard.html is already current.'
            exit 0
          fi
          git commit -m 'Deploy self-hosted BlueRise Home Code Map'
          git push origin HEAD:main
