name: Build single Home Code Map dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-home-code-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build one dashboard.html
        shell: bash
        run: |
          set -euo pipefail
          files=(
            assets/home-code-map-exact/part-001.b64
            assets/home-code-map-exact/part-002.b64
            assets/home-code-map-exact/part-003.b64
            assets/home-code-map-exact/part-004.b64
            assets/home-code-map-exact/part-005.b64
            assets/home-code-map-exact/part-006.b64
            assets/home-code-map-exact/part-007.b64
            assets/home-code-map-exact/rest-001.b64
          )

          : > /tmp/home-code-map.gz
          for f in "${files[@]}"; do
            test -s "$f"
            tr -d '\r\n ' < "$f" | base64 -d >> /tmp/home-code-map.gz
          done

          gzip -t /tmp/home-code-map.gz
          gzip -dc /tmp/home-code-map.gz > dashboard.html

          test "$(wc -c < dashboard.html)" -gt 100000
          grep -qi '<!DOCTYPE html' dashboard.html
          grep -qi '<html' dashboard.html
          grep -qi '<script' dashboard.html
          if grep -q 'drive.google.com' dashboard.html; then
            echo 'Drive dependency is not allowed.' >&2
            exit 1
          fi

          echo "dashboard bytes: $(wc -c < dashboard.html)"
          echo "dashboard sha256: $(sha256sum dashboard.html | cut -d' ' -f1)"

      - name: Commit direct HTML dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          if git diff --cached --quiet; then
            echo 'dashboard.html is already current.'
            exit 0
          fi
          git commit -m 'Deploy Home Code Map as direct HTML'
          git push origin HEAD:main
