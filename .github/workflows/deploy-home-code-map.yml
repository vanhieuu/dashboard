name: Deploy exact Home Code Map dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-home-code-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact bundled Home Code Map
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet gdown
          gdown 'https://drive.google.com/uc?id=1FrlZQC25OPG7T5oRw4x42OG46LtEjbpY' -O dashboard.html

          test "$(wc -c < dashboard.html)" -gt 1000000
          grep -q '__bundler/manifest' dashboard.html
          echo 'a16d679600bb54b0b5059f9ab64b5a5324ce2c014ce760e26e26d752c09eef10  dashboard.html' | sha256sum -c -

      - name: Commit dashboard bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          if git diff --cached --quiet; then
            echo 'dashboard.html is already current.'
            exit 0
          fi
          git commit -m 'Deploy exact BlueRise Home Code Map bundle'
          git push origin HEAD:main

