name: Finalize direct Home Code Map dashboard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-home-code-map.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build verified direct dashboard
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/home-code-map.b64
          for i in $(seq -w 1 10); do tr -d '\r\n ' < "assets/home-code-map-live/part-${i}.b64" >> /tmp/home-code-map.b64; done
          for f in part-11.b64 part-12.b64 part-13.b64; do tr -d '\r\n ' < "assets/home-code-map-live/$f" >> /tmp/home-code-map.b64; done
          printf '%s' '' >> /tmp/home-code-map.b64
          tr -d '\r\n ' < /tmp/home-code-map.b64 | base64 -d > /tmp/home-code-map.gz
          echo 'd5a566382e87b5541ec46d2e4eb41b3997ab73c263b844453b91afebd05f4954  /tmp/home-code-map.gz' | sha256sum -c -
          gzip -dc /tmp/home-code-map.gz > dashboard.html
          echo 'e21f248576bdecc60b0ae5a2d2e642134a3a8633d5a958df9f91c3abf1765903  dashboard.html' | sha256sum -c -
          ! grep -q 'drive.google.com' dashboard.html
          rm -rf assets/home-code-map-live assets/home-code-map-exact assets/home-code-map-package assets/bluerise-home-code-map
          rm -f .github/workflows/deploy-home-code-map.yml
      - name: Commit direct HTML and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dashboard.html assets .github/workflows
          git commit -m 'Deploy Home Code Map direct HTML and remove chunks'
          git push origin HEAD:main
