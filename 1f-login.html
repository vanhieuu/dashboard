<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueSky - Dark mode</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#061F33;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:#0B72AE}a:hover{color:#063E62}
  #stage{position:fixed;top:50%;left:50%;width:430px;height:932px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--s,1));background:#061F33;overflow:hidden}
  .ui{position:absolute;inset:0;display:flex;flex-direction:column;padding:52px 32px 32px}
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 300 640" width="430" height="932" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;display:block">
<defs><linearGradient id="e-n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04182A"/><stop offset="0.6" stop-color="#083E63"/><stop offset="1" stop-color="#0B72AE"/></linearGradient><radialGradient id="e-m" cx="0.5" cy="0.5" r="0.5"><stop offset="0.45" stop-color="#FFF3CF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF3CF" stop-opacity="0"/></radialGradient></defs>
<rect width="300" height="640" fill="url(#e-n)"/>
<circle cx="240" cy="64" r="52" fill="url(#e-m)"/><circle cx="240" cy="64" r="22" fill="#FFF3CF"/>
<g fill="#FFFFFF"><circle cx="40" cy="72" r="1.8" opacity="0.9"/><circle cx="96" cy="46" r="1.3" opacity="0.6"/><circle cx="132" cy="110" r="1.6" opacity="0.75"/><circle cx="62" cy="150" r="1.2" opacity="0.5"/><circle cx="264" cy="212" r="1.7" opacity="0.8"/><circle cx="30" cy="238" r="1.4" opacity="0.6"/><circle cx="176" cy="60" r="1.1" opacity="0.5"/><circle cx="112" cy="182" r="1.5" opacity="0.7"/><circle cx="248" cy="300" r="1.2" opacity="0.5"/><circle cx="66" cy="330" r="1.6" opacity="0.6"/></g>
<path d="M62 372 l2.6 5.6 l6 .8 l-4.4 4.2 l1.1 6.1 l-5.3 -2.9 l-5.3 2.9 l1.1 -6.1 l-4.4 -4.2 l6 -.8 Z" fill="#FFD166" opacity="0.8"/>
<g fill="#0B72AE" opacity="0.5"><ellipse cx="90" cy="418" rx="52" ry="30"/><ellipse cx="44" cy="430" rx="32" ry="20"/><ellipse cx="136" cy="430" rx="30" ry="19"/><rect x="32" y="424" width="128" height="24" rx="12"/></g>
<g fill="#6FC6EE" opacity="0.28"><ellipse cx="234" cy="500" rx="44" ry="26"/><ellipse cx="272" cy="510" rx="26" ry="17"/><rect x="192" y="504" width="106" height="20" rx="10"/></g>
<path d="M0,570 C56,548 96,594 156,576 C214,558 252,598 300,582 L300,640 L0,640 Z" fill="#0B72AE" opacity="0.45"/>
</svg>
<div class="ui" style="gap:16px">
<div style="font:800 32px/38px 'Baloo 2',sans-serif;color:#EAF6FD">Chế độ tối</div>
<div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px"><div style="height:14.5px;width:60%;border-radius:8px;background:rgba(255,255,255,.28)"></div><div style="height:14.5px;width:82%;border-radius:8px;background:rgba(255,255,255,.16)"></div></div>
<div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px"><div style="height:14.5px;width:48%;border-radius:8px;background:rgba(255,255,255,.28)"></div><div style="height:14.5px;width:70%;border-radius:8px;background:rgba(255,255,255,.16)"></div></div>
</div></div>
<script>
(function(){var st=document.getElementById("stage");function fit(){st.style.setProperty("--s",Math.min(innerWidth/430,innerHeight/932));}fit();addEventListener("resize",fit);addEventListener("orientationchange",fit);})();
</script>
</body>
</html>
