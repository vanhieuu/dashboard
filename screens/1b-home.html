<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueSky - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#F5FAFD;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:#0B72AE}a:hover{color:#063E62}
  #stage{position:fixed;top:50%;left:50%;width:430px;height:932px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--s,1));background:#F5FAFD;overflow:hidden}
  .ui{position:absolute;inset:0;display:flex;flex-direction:column;padding:52px 32px 32px}
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 300 640" width="430" height="932" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;display:block">
<defs><linearGradient id="b-h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B72AE"/><stop offset="1" stop-color="#1B9BD8"/></linearGradient></defs>
<rect width="300" height="640" fill="#F5FAFD"/>
<path d="M0,0 L300,0 L300,232 C244,266 208,214 150,232 C92,250 54,214 0,238 Z" fill="url(#b-h)"/>
<path d="M0,238 C54,214 92,250 150,232 C208,214 244,266 300,232 L300,256 C244,290 208,238 150,256 C92,274 54,238 0,262 Z" fill="#6FC6EE" opacity="0.45"/>
<g fill="#fff" opacity="0.22"><ellipse cx="60" cy="70" rx="30" ry="18"/><ellipse cx="34" cy="78" rx="20" ry="13"/><ellipse cx="86" cy="79" rx="18" ry="12"/><rect x="28" y="74" width="76" height="14" rx="7"/></g>
<g fill="#fff" opacity="0.16"><ellipse cx="238" cy="140" rx="34" ry="21"/><ellipse cx="208" cy="150" rx="22" ry="15"/><ellipse cx="266" cy="150" rx="20" ry="13"/><rect x="200" y="145" width="88" height="16" rx="8"/></g>
<circle cx="256" cy="164" r="20" fill="#FFD166" opacity="0.8"/>
<circle cx="26" cy="470" r="46" fill="#D6EEF9" opacity="0.7"/><circle cx="286" cy="560" r="60" fill="#D6EEF9" opacity="0.6"/><circle cx="238" cy="418" r="8" fill="#6FC6EE" opacity="0.5"/><circle cx="70" cy="392" r="5" fill="#FFD166" opacity="0.7"/>
</svg>
<div class="ui" style="gap:16px">
<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font:700 17px/24px 'Be Vietnam Pro',sans-serif;color:rgba(255,255,255,.8)">Chào buổi sáng</div><div style="font:800 32px/38px 'Baloo 2',sans-serif;color:#fff">BlueSky</div></div><div style="width:51.5px;height:51.5px;border-radius:50%;background:rgba(255,255,255,.3)"></div></div>
<div style="margin-top:24px;background:#fff;border-radius:24px;padding:24px;box-shadow:0 14.5px 34.5px rgba(11,114,174,.14);display:flex;flex-direction:column;gap:12px"><div style="height:14.5px;width:55%;border-radius:8px;background:#D6EEF9"></div><div style="height:14.5px;width:80%;border-radius:8px;background:#EDF5F9"></div><div style="height:14.5px;width:40%;border-radius:8px;background:#EDF5F9"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div style="height:126px;border-radius:24px;background:#fff;box-shadow:0 8.5px 23px rgba(11,114,174,.10)"></div><div style="height:126px;border-radius:24px;background:#fff;box-shadow:0 8.5px 23px rgba(11,114,174,.10)"></div></div>
</div></div>
<script>
(function(){var st=document.getElementById("stage");function fit(){st.style.setProperty("--s",Math.min(innerWidth/430,innerHeight/932));}fit();addEventListener("resize",fit);addEventListener("orientationchange",fit);})();
</script>
</body>
</html>
