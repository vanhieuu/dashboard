<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#063E62">
  <title>BlueRise — Absence Flow Storyboard</title>
  <style>
    :root{
      color-scheme:light;
      --blue:#0B72AE;
      --blue-dark:#063E62;
      --blue-soft:#EAF6FD;
      --sky:#37AEE2;
      --ink:#0B3B58;
      --muted:#627D90;
      --line:#D9E7EF;
      --page:#F4F8FA;
      --surface:#fff;
      --yellow:#FFD166;
      --shadow:0 24px 70px rgba(6,62,98,.18);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--page);color:var(--ink)}
    body{min-height:100vh;overflow:hidden}
    button{font:inherit}
    .app{min-height:100vh;display:grid;grid-template-columns:310px minmax(0,1fr)}
    .sidebar{
      position:relative;z-index:2;display:flex;min-height:100vh;flex-direction:column;
      padding:28px 22px 22px;color:#fff;background:
        radial-gradient(circle at 90% 2%,rgba(255,209,102,.23),transparent 21rem),
        linear-gradient(155deg,var(--blue-dark),var(--blue));
      box-shadow:18px 0 50px rgba(6,62,98,.14)
    }
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:22px;box-shadow:inset 0 1px rgba(255,255,255,.18)}
    .brand small{display:block;margin-bottom:3px;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.65}
    .brand strong{font-size:18px;letter-spacing:-.02em}
    .intro{margin:32px 2px 22px}
    .intro h1{margin:0;font-size:32px;line-height:1.02;letter-spacing:-.045em}
    .intro p{margin:13px 0 0;font-size:13px;line-height:1.65;color:rgba(255,255,255,.72)}
    .flow-label{margin:4px 2px 10px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
    .nav{display:flex;flex:1;min-height:0;flex-direction:column;gap:7px;overflow:auto;padding-right:3px;scrollbar-width:thin}
    .nav-button{
      width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) 18px;align-items:center;gap:10px;
      padding:10px;border:1px solid transparent;border-radius:15px;color:rgba(255,255,255,.78);
      background:transparent;text-align:left;cursor:pointer;transition:.18s ease
    }
    .nav-button:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav-button[aria-current="true"]{background:#fff;color:var(--ink);box-shadow:0 12px 28px rgba(6,35,53,.2)}
    .step{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.12);font-size:12px;font-weight:800}
    .nav-button[aria-current="true"] .step{background:var(--blue-soft);color:var(--blue)}
    .nav-copy{min-width:0}
    .nav-title{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-subtitle{display:block;margin-top:2px;font-size:10px;opacity:.58;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chev{font-size:17px;opacity:.45}
    .side-footer{display:flex;justify-content:space-between;gap:10px;padding:18px 2px 0;font-size:10px;color:rgba(255,255,255,.5)}
    .workspace{min-width:0;min-height:100vh;display:flex;flex-direction:column;background:
      radial-gradient(circle at 10% 0%,rgba(55,174,226,.15),transparent 32rem),
      radial-gradient(circle at 96% 100%,rgba(255,209,102,.17),transparent 28rem),
      var(--page)}
    .toolbar{
      height:80px;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid rgba(183,205,218,.72);
      background:rgba(255,255,255,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
    }
    .screen-info{min-width:0;flex:1}
    .screen-info h2{margin:0;font-size:18px;letter-spacing:-.025em}
    .screen-info p{margin:4px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .counter{padding:8px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:800;white-space:nowrap}
    .tool-button{
      display:inline-flex;height:39px;align-items:center;justify-content:center;gap:7px;padding:0 13px;border:1px solid var(--line);
      border-radius:12px;background:#fff;color:var(--ink);font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 5px 14px rgba(6,62,98,.05)
    }
    .tool-button:hover{border-color:#A9CADA;background:#FAFDFF}
    .preview-area{position:relative;flex:1;min-height:0;padding:22px 28px 26px}
    .preview-card{
      position:relative;width:100%;height:100%;overflow:hidden;border:1px solid rgba(183,205,218,.9);
      border-radius:24px;background:#0B72AE;box-shadow:var(--shadow)
    }
    iframe{display:block;width:100%;height:100%;border:0;background:#0B72AE}
    .pager{
      position:absolute;left:50%;bottom:39px;z-index:3;display:flex;align-items:center;gap:9px;transform:translateX(-50%);
      padding:7px;border:1px solid rgba(183,205,218,.75);border-radius:16px;background:rgba(255,255,255,.9);
      box-shadow:0 14px 36px rgba(6,62,98,.16);backdrop-filter:blur(14px)
    }
    .pager button{
      width:42px;height:38px;border:0;border-radius:11px;background:var(--blue-soft);color:var(--blue);font-size:18px;font-weight:800;cursor:pointer
    }
    .pager button:hover{background:#D8EEF9}
    .pager button:disabled{opacity:.35;cursor:not-allowed}
    .dots{display:flex;gap:5px;padding:0 5px}
    .dot{width:7px;height:7px;border:0;border-radius:999px;padding:0;background:#C6D9E4;cursor:pointer;transition:.18s ease}
    .dot.active{width:21px;background:var(--blue)}
    .mobile-header{display:none}
    @media(max-width:900px){
      body{overflow:auto}
      .app{display:block}
      .sidebar{display:none}
      .workspace{min-height:100vh}
      .mobile-header{
        display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,var(--blue-dark),var(--blue))
      }
      .mobile-header .brand-mark{width:40px;height:40px;border-radius:13px;font-size:18px}
      .mobile-title{min-width:0;flex:1}
      .mobile-title strong{display:block;font-size:14px}
      .mobile-title span{display:block;margin-top:2px;font-size:10px;opacity:.66}
      .mobile-select{
        max-width:43%;height:38px;border:1px solid rgba(255,255,255,.24);border-radius:11px;padding:0 10px;
        color:#fff;background:rgba(255,255,255,.12);font-size:11px;font-weight:700
      }
      .mobile-select option{color:#111;background:#fff}
      .toolbar{height:auto;min-height:72px;padding:13px 16px}
      .toolbar .tool-button span{display:none}
      .preview-area{height:calc(100vh - 140px);min-height:570px;padding:12px}
      .preview-card{border-radius:18px}
      .pager{bottom:25px}
    }
    @media(max-width:560px){
      .screen-info p{display:none}
      .counter{display:none}
      .toolbar{gap:8px}
      .tool-button{padding:0 11px}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">BR</div>
        <div><small>Product storyboard</small><strong>BlueRise</strong></div>
      </div>
      <div class="intro">
        <h1>Absence<br>Flow</h1>
        <p>Toàn bộ 7 màn hình của luồng xin nghỉ được đóng gói trong một file HTML duy nhất.</p>
      </div>
      <div class="flow-label">Các trạng thái</div>
      <nav class="nav" id="nav" aria-label="Điều hướng màn hình"></nav>
      <div class="side-footer"><span>Static HTML</span><span>← → để chuyển màn</span></div>
    </aside>

    <main class="workspace">
      <div class="mobile-header">
        <div class="brand-mark" aria-hidden="true">BR</div>
        <div class="mobile-title"><strong>BlueRise · Absence Flow</strong><span>7 màn hình trong một file</span></div>
        <select id="mobileSelect" class="mobile-select" aria-label="Chọn màn hình"></select>
      </div>

      <header class="toolbar">
        <div class="screen-info">
          <h2 id="screenTitle">Đang tải…</h2>
          <p id="screenDescription"></p>
        </div>
        <span class="counter" id="counter"></span>
        <button class="tool-button" id="reloadButton" type="button" title="Tải lại màn hình"><span>Tải lại</span> ↻</button>
        <button class="tool-button" id="fullscreenButton" type="button" title="Xem toàn màn hình"><span>Toàn màn hình</span> ⛶</button>
      </header>

      <section class="preview-area" aria-label="Khu vực xem storyboard">
        <div class="preview-card" id="previewCard">
          <iframe id="preview" title="BlueRise Absence screen" allow="fullscreen"></iframe>
        </div>
        <div class="pager" aria-label="Điều hướng tuần tự">
          <button id="prevButton" type="button" aria-label="Màn hình trước">←</button>
          <div class="dots" id="dots" aria-hidden="true"></div>
          <button id="nextButton" type="button" aria-label="Màn hình tiếp theo">→</button>
        </div>
      </section>
    </main>
  </div>

    const nav = document.getElementById('nav');
    const preview = document.getElementById('preview');
    const screenTitle = document.getElementById('screenTitle');
    const screenDescription = document.getElementById('screenDescription');
    const counter = document.getElementById('counter');
    const dots = document.getElementById('dots');
    const mobileSelect = document.getElementById('mobileSelect');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const reloadButton = document.getElementById('reloadButton');
    const fullscreenButton = document.getElementById('fullscreenButton');
    const previewCard = document.getElementById('previewCard');

    let currentIndex = 0;
    let decodedCache = new Map();

    function decodeUtf8Base64(value) {
      if (decodedCache.has(value)) return decodedCache.get(value);
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const text = new TextDecoder('utf-8').decode(bytes);
      decodedCache.set(value, text);
      return text;
    }

    function buildNavigation() {
      screens.forEach((screen, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'nav-button';
        button.dataset.index = String(index);
        button.innerHTML =
          '<span class="step">' + String(index + 1).padStart(2, '0') + '</span>' +
          '<span class="nav-copy"><span class="nav-title">' + screen.title + '</span>' +
          '<span class="nav-subtitle">' + screen.description + '</span></span>' +
          '<span class="chev">›</span>';
        button.addEventListener('click', () => showScreen(index, true));
        nav.appendChild(button);

        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = (index + 1) + '. ' + screen.title;
        mobileSelect.appendChild(option);

        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'dot';
        dot.dataset.index = String(index);
        dot.setAttribute('aria-label', screen.title);
        dot.addEventListener('click', () => showScreen(index, true));
        dots.appendChild(dot);
      });
      mobileSelect.addEventListener('change', event => showScreen(Number(event.target.value), true));
    }

    function updateHash(screen) {
      const nextHash = '#' + screen.id;
      if (location.hash !== nextHash) history.replaceState(null, '', nextHash);
    }

    function showScreen(index, syncHash = false) {
      if (!Number.isInteger(index) || index < 0 || index >= screens.length) return;
      currentIndex = index;
      const screen = screens[index];
      screenTitle.textContent = screen.title;
      screenDescription.textContent = screen.description;
      counter.textContent = (index + 1) + ' / ' + screens.length;
      preview.title = 'BlueRise — ' + screen.title;
      preview.srcdoc = decodeUtf8Base64(screen.html);
      mobileSelect.value = String(index);
      prevButton.disabled = index === 0;
      nextButton.disabled = index === screens.length - 1;

      nav.querySelectorAll('.nav-button').forEach((button, buttonIndex) => {
        button.setAttribute('aria-current', buttonIndex === index ? 'true' : 'false');
      });
      dots.querySelectorAll('.dot').forEach((dot, dotIndex) => {
        dot.classList.toggle('active', dotIndex === index);
      });
      if (syncHash) updateHash(screen);
    }

    function indexFromHash() {
      const id = location.hash.replace(/^#/, '');
      const found = screens.findIndex(screen => screen.id === id);
      return found >= 0 ? found : 0;
    }

    prevButton.addEventListener('click', () => showScreen(currentIndex - 1, true));
    nextButton.addEventListener('click', () => showScreen(currentIndex + 1, true));
    reloadButton.addEventListener('click', () => {
      const screen = screens[currentIndex];
      preview.srcdoc = decodeUtf8Base64(screen.html);
    });
    fullscreenButton.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await previewCard.requestFullscreen();
      } catch (error) {
        console.warn('Fullscreen is not available:', error);
      }
    });
    addEventListener('hashchange', () => showScreen(indexFromHash(), false));
    addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' && currentIndex > 0) showScreen(currentIndex - 1, true);
      if (event.key === 'ArrowRight' && currentIndex < screens.length - 1) showScreen(currentIndex + 1, true);
    });

    buildNavigation();
    showScreen(indexFromHash(), false);
  </script>
