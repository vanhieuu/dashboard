<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueRise - Nhập số điện thoại</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@keyframes br-rise{0%{transform:translateY(14px) scale(.92);opacity:.45}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes br-glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.05)}}
@keyframes br-drift{0%{transform:translateX(-9px)}100%{transform:translateX(13px)}}
@keyframes br-caret{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes br-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B72AE;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:#0B72AE}a:hover{color:#063E62}
/* /login — khung thiết kế 430x932, scale contain để vừa mọi màn hình */
#stage{position:fixed;top:50%;left:50%;width:430px;height:932px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--s,1))}
#stage > div{border-radius:0 !important;box-shadow:none !important;height:932px !important}
</style>
</head>
<body>
<div id="stage">
<div style="position:relative;width:430px;height:932px;border-radius:38px;overflow:hidden;background:#FBFDFF;box-shadow:0 24px 60px rgba(6,62,98,.22);display:flex;flex-direction:column">

<div style="position:relative;height:322px;flex-shrink:0;overflow:hidden;background:#0B72AE">
<svg viewBox="0 0 430 322" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;display:block">
<defs><linearGradient id="h1-g" x1="0" y1="0" x2="0.65" y2="1"><stop offset="0" stop-color="#063E62"/><stop offset="0.62" stop-color="#0B72AE"/><stop offset="1" stop-color="#37AEE2"/></linearGradient><radialGradient id="h1-s" cx="0.5" cy="0.5" r="0.5"><stop offset="0.34" stop-color="#FFE9AE" stop-opacity="0.6"/><stop offset="1" stop-color="#FFE9AE" stop-opacity="0"/></radialGradient></defs>
<rect width="430" height="322" fill="url(#h1-g)"/>
<circle cx="326" cy="236" r="96" fill="url(#h1-s)" style="animation:br-glow 5.4s ease-in-out infinite"/>
<circle cx="326" cy="236" r="34" fill="#FFF3CF"/>
<circle cx="58" cy="52" r="2.1" fill="#fff" opacity="0.75"/><circle cx="132" cy="34" r="1.5" fill="#fff" opacity="0.5"/><circle cx="248" cy="62" r="1.7" fill="#fff" opacity="0.6"/>
<g fill="#fff" opacity="0.1" style="animation:br-drift 15s ease-in-out infinite alternate"><ellipse cx="106" cy="188" rx="46" ry="27"/><ellipse cx="66" cy="198" rx="29" ry="19"/><ellipse cx="146" cy="198" rx="27" ry="18"/><rect x="60" y="192" width="118" height="22" rx="11"/></g>
<path d="M0,282 C78,262 132,300 218,282 C300,264 352,296 430,278 L430,322 L0,322 Z" fill="#FBFDFF" opacity="0.14"/>
</svg>
<div style="position:relative;z-index:1;padding:48px 24px 0;display:flex;flex-direction:column;align-items:center;gap:12px">
<div style="width:74px;height:74px;border-radius:24px;background:#fff;box-shadow:0 10px 26px rgba(4,24,42,.3);display:flex;align-items:center;justify-content:center;animation:br-rise .7s cubic-bezier(.2,.9,.3,1) both">
<svg viewBox="0 0 44 44" width="42" height="42">
<defs><linearGradient id="mark-g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0B72AE"/><stop offset="1" stop-color="#37AEE2"/></linearGradient></defs>
<circle cx="22" cy="24" r="9" fill="#FFD166"/>
<path d="M6 30 h32" stroke="url(#mark-g)" stroke-width="3.4" stroke-linecap="round"/>
<path d="M10 36 h24" stroke="url(#mark-g)" stroke-width="3.4" stroke-linecap="round" opacity="0.45"/>
<path d="M22 8 v4 M33 12 l-2.6 2.8 M11 12 l2.6 2.8" stroke="#FFD166" stroke-width="2.6" stroke-linecap="round"/>
</svg>
</div>
<div style="font:800 26px/32px 'Baloo 2',sans-serif;color:#fff;line-height:32px;letter-spacing:.2px">BlueRise</div>
<div style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:rgba(255,255,255,.82)">Học tập cùng con mỗi ngày</div>
</div>
</div>

<div style="flex:1;margin-top:-48px;border-radius:32px 32px 0 0;background:#fff;padding:24px 24px 24px;position:relative;z-index:2;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(6,62,98,.1)">
<div style="display:flex;gap:4px;margin-bottom:24px">
<span style="width:22px;height:5px;border-radius:4px;background:#0B72AE"></span>
<span style="width:5px;height:5px;border-radius:4px;background:#DDEAF3"></span><span style="width:5px;height:5px;border-radius:4px;background:#DDEAF3"></span><span style="width:5px;height:5px;border-radius:4px;background:#DDEAF3"></span><span style="width:5px;height:5px;border-radius:4px;background:#DDEAF3"></span>
</div>
<div style="font:800 26px/32px 'Baloo 2',sans-serif;color:#0B3B58;line-height:32px">Đăng nhập</div>
<div style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488;margin-top:4px">Nhập số điện thoại để nhận mã xác thực.</div>

<div style="margin-top:24px">
<div style="font:700 13px/20px 'Be Vietnam Pro',sans-serif;color:#0B3B58;margin-bottom:8px">Số điện thoại</div>
<div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;border-radius:16px;border:2px solid #0B72AE;background:#FBFDFF;box-shadow:0 0 0 4px rgba(11,114,174,.1)">
<span style="font:700 15px/22px 'Be Vietnam Pro',sans-serif;color:#0B3B58">+84</span>
<span style="width:1px;height:24px;background:#DDEAF3"></span>
<span style="flex:1;font:700 17px/24px 'Be Vietnam Pro',sans-serif;color:#0B3B58;letter-spacing:.6px">0912 345 789<span style="display:inline-block;width:2px;height:18px;background:#0B72AE;margin-left:2px;vertical-align:-3px;animation:br-caret 1.1s step-end infinite"></span></span>
<i class="fa-solid fa-phone" style="font-size:15px;color:#0B72AE;line-height:1"></i>
</div>
<div style="display:flex;gap:8px;align-items:flex-start;margin-top:12px">
<i class="fa-solid fa-circle-info" style="font-size:13px;color:#8AA3B4;margin-top:2px;line-height:1"></i>
<div style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#8AA3B4;flex:1">Mã xác thực OTP gồm 6 chữ số sẽ được gửi tới số điện thoại này.</div>
</div>
</div>

<div style="margin-top:24px;height:58px;border-radius:16px;background:#0B72AE;color:#fff;display:flex;align-items:center;justify-content:center;font:700 17px/24px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #085A8B,0 10px 22px rgba(11,114,174,.28);cursor:pointer" style-active="transform:translateY(4px);box-shadow:0 0 0 #085A8B">Tiếp tục</div>

<div style="display:flex;gap:12px;margin-top:12px">
<div style="flex:1;height:50px;border-radius:16px;background:#EAF6FD;color:#0B72AE;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px/22px 'Baloo 2',sans-serif;cursor:pointer"><i class="fa-solid fa-face-smile" style="font-size:15px;line-height:1"></i>Face ID</div>
<div style="flex:1;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font:700 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488;cursor:pointer">Quên mật khẩu?</div>
</div>

<div style="display:flex;align-items:center;gap:12px;margin:24px 0 16px">
<span style="flex:1;height:1px;background:#DDEAF3"></span>
<span style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#8AA3B4">hoặc</span>
<span style="flex:1;height:1px;background:#DDEAF3"></span>
</div>
<div style="height:56px;border-radius:16px;background:#fff;border:2px solid #DDEAF3;color:#0B3B58;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px/22px 'Baloo 2',sans-serif;cursor:pointer" style-active="transform:translateY(2px)"><i class="fa-solid fa-magnifying-glass" style="font-size:15px;color:#0B72AE;line-height:1"></i>Tra cứu tuyển sinh</div>
</div>
</div>
</div>
<script>
(function(){
  var st = document.getElementById('stage');
  function fit(){ st.style.setProperty('--s', Math.min(innerWidth/430, innerHeight/932)); }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
})();
</script>
</body>
</html>
