<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueRise - Chọn học sinh</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@keyframes br-rise{0%{transform:translateY(14px) scale(.92);opacity:.45}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes br-glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.05)}}
@keyframes br-drift{0%{transform:translateX(-9px)}100%{transform:translateX(13px)}}
@keyframes br-caret{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes br-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B72AE;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:#0B72AE}a:hover{color:#063E62}
/* /login-select-student — khung thiết kế 430x932, scale contain để vừa mọi màn hình */
#stage{position:fixed;top:50%;left:50%;width:430px;height:932px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--s,1))}
#stage > div{border-radius:0 !important;box-shadow:none !important;height:932px !important}
</style>
</head>
<body>
<div id="stage">
<div style="position:relative;width:430px;height:932px;border-radius:38px;overflow:hidden;background:#FBFDFF;box-shadow:0 24px 60px rgba(6,62,98,.22);display:flex;flex-direction:column">
<div style="position:relative;height:238px;flex-shrink:0;overflow:hidden;background:#0B72AE">
<svg viewBox="0 0 430 238" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;display:block">
<defs><linearGradient id="h6-g" x1="0" y1="0" x2="0.65" y2="1"><stop offset="0" stop-color="#063E62"/><stop offset="0.62" stop-color="#0B72AE"/><stop offset="1" stop-color="#37AEE2"/></linearGradient><radialGradient id="h6-s" cx="0.5" cy="0.5" r="0.5"><stop offset="0.34" stop-color="#FFE9AE" stop-opacity="0.55"/><stop offset="1" stop-color="#FFE9AE" stop-opacity="0"/></radialGradient></defs>
<rect width="430" height="238" fill="url(#h6-g)"/>
<circle cx="340" cy="180" r="80" fill="url(#h6-s)" style="animation:br-glow 5.2s ease-in-out infinite"/>
<circle cx="340" cy="180" r="27" fill="#FFF3CF"/>
<circle cx="66" cy="46" r="1.9" fill="#fff" opacity="0.7"/><circle cx="150" cy="30" r="1.4" fill="#fff" opacity="0.5"/>
<g fill="#fff" opacity="0.09" style="animation:br-drift 16s ease-in-out infinite alternate"><ellipse cx="96" cy="146" rx="42" ry="25"/><ellipse cx="60" cy="155" rx="27" ry="17"/><rect x="54" y="150" width="108" height="20" rx="10"/></g>
</svg>
<div style="position:relative;z-index:1;padding:52px 24px 0">
<div style="font:700 13px/20px 'Be Vietnam Pro',sans-serif;color:rgba(255,255,255,.8)">Đăng nhập thành công</div>
<div style="font:800 26px/32px 'Baloo 2',sans-serif;color:#fff;margin-top:8px;line-height:32px">Hôm nay học cùng ai?</div>
<div style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:rgba(255,255,255,.8);margin-top:4px">SĐT 09••• •• 789 đang gắn với 3 học sinh</div>
</div>
</div>

<div style="flex:1;margin-top:-32px;border-radius:32px 32px 0 0;background:#fff;padding:24px 24px 24px;position:relative;z-index:2;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(6,62,98,.1)">
<div style="font:700 13px/20px 'Be Vietnam Pro',sans-serif;letter-spacing:1.6px;color:#0B3B58;margin-bottom:16px">CHỌN HỌC SINH</div>

<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;border:2px solid #0B72AE;background:#F4FAFD;box-shadow:0 3px 0 #DDEAF3;cursor:pointer">
<div style="position:relative;width:52px;height:52px;border-radius:16px;flex-shrink:0;background:#EAF6FD;display:flex;align-items:center;justify-content:center;font:800 17px/24px 'Baloo 2',sans-serif;color:#0B72AE">MA</div>
<div style="flex:1;min-width:0">
<div style="font:700 17px/24px 'Baloo 2',sans-serif;color:#0B3B58">Nguyễn Minh Anh</div>
<div style="display:flex;align-items:center;gap:8px;margin-top:4px">
<i class="fa-solid fa-location-dot" style="font-size:11px;color:#8AA3B4;line-height:1"></i>
<span style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488">BlueRise Cầu Giấy</span>
</div>
</div>
<div style="width:26px;height:26px;border-radius:50%;border:2.5px solid #0B72AE;background:#0B72AE;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-solid fa-check" style="font-size:13px;color:#fff;line-height:1"></i></div>
</div>
<div style="display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;border:2px solid #EDF4F9;background:#fff;box-shadow:none;cursor:pointer">
<div style="position:relative;width:52px;height:52px;border-radius:16px;flex-shrink:0;background:#E6F5F1;display:flex;align-items:center;justify-content:center;font:800 17px/24px 'Baloo 2',sans-serif;color:#0B7A62">MK</div>
<div style="flex:1;min-width:0">
<div style="font:700 17px/24px 'Baloo 2',sans-serif;color:#0B3B58">Nguyễn Minh Khôi</div>
<div style="display:flex;align-items:center;gap:8px;margin-top:4px">
<i class="fa-solid fa-location-dot" style="font-size:11px;color:#8AA3B4;line-height:1"></i>
<span style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488">BlueRise Cầu Giấy</span>
</div>
</div>
<div style="width:26px;height:26px;border-radius:50%;border:2.5px solid #CBDFEC;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-solid fa-check" style="font-size:13px;color:transparent;line-height:1"></i></div>
</div>
<div style="display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;border:2px solid #EDF4F9;background:#fff;box-shadow:none;cursor:pointer">
<div style="position:relative;width:52px;height:52px;border-radius:16px;flex-shrink:0;background:#FFF8E8;display:flex;align-items:center;justify-content:center;font:800 17px/24px 'Baloo 2',sans-serif;color:#B4720B">BC</div>
<div style="flex:1;min-width:0">
<div style="font:700 17px/24px 'Baloo 2',sans-serif;color:#0B3B58">Nguyễn Bảo Châu</div>
<div style="display:flex;align-items:center;gap:8px;margin-top:4px">
<i class="fa-solid fa-location-dot" style="font-size:11px;color:#8AA3B4;line-height:1"></i>
<span style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488">BlueRise Hà Đông</span>
</div>
</div>
<div style="width:26px;height:26px;border-radius:50%;border:2.5px solid #CBDFEC;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-solid fa-check" style="font-size:13px;color:transparent;line-height:1"></i></div>
</div>
</div>

<div style="margin-top:24px;height:58px;border-radius:16px;background:#0B72AE;color:#fff;display:flex;align-items:center;justify-content:center;font:700 17px/24px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #085A8B,0 10px 22px rgba(11,114,174,.28);cursor:pointer" style-active="transform:translateY(4px);box-shadow:0 0 0 #085A8B">Tiếp tục</div>

<div style="margin-top:auto;display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:#F4FAFD">
<i class="fa-solid fa-arrows-rotate" style="font-size:15px;color:#0B72AE;line-height:1"></i>
<div style="font:500 11px/16px 'Be Vietnam Pro',sans-serif;color:#5A7488;flex:1">Bạn có thể đổi con bất cứ lúc nào ở đầu trang chủ.</div>
</div>
</div>
</div>
</div>
<script>
(function(){
  var st = document.getElementById('stage');
  function fit(){ st.style.setProperty('--s', Math.min(innerWidth/430, innerHeight/932)); }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
})();
</script>
</body>
</html>
