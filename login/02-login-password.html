<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueRise - Nhập mật khẩu</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@keyframes br-rise{0%{transform:translateY(14px) scale(.92);opacity:.45}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes br-glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.05)}}
@keyframes br-drift{0%{transform:translateX(-9px)}100%{transform:translateX(13px)}}
@keyframes br-caret{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes br-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B72AE;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:#0B72AE}a:hover{color:#063E62}
/* /login-password — khung thiết kế 430x932, scale contain để vừa mọi màn hình */
#stage{position:fixed;top:50%;left:50%;width:430px;height:932px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--s,1))}
#stage > div{border-radius:0 !important;box-shadow:none !important;height:932px !important}
</style>
</head>
<body>
<div id="stage">
<div style="position:relative;width:430px;height:932px;border-radius:38px;overflow:hidden;background:#FBFDFF;box-shadow:0 24px 60px rgba(6,62,98,.22);display:flex;flex-direction:column">
<div style="position:relative;height:250px;flex-shrink:0;overflow:hidden;background:#0B72AE">
<svg viewBox="0 0 430 250" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;display:block">
<defs><linearGradient id="h2-g" x1="0" y1="0" x2="0.65" y2="1"><stop offset="0" stop-color="#063E62"/><stop offset="0.62" stop-color="#0B72AE"/><stop offset="1" stop-color="#37AEE2"/></linearGradient><radialGradient id="h2-s" cx="0.5" cy="0.5" r="0.5"><stop offset="0.34" stop-color="#FFE9AE" stop-opacity="0.55"/><stop offset="1" stop-color="#FFE9AE" stop-opacity="0"/></radialGradient></defs>
<rect width="430" height="250" fill="url(#h2-g)"/>
<circle cx="336" cy="188" r="82" fill="url(#h2-s)" style="animation:br-glow 5.4s ease-in-out infinite"/>
<circle cx="336" cy="188" r="28" fill="#FFF3CF"/>
<g fill="#fff" opacity="0.09" style="animation:br-drift 16s ease-in-out infinite alternate"><ellipse cx="98" cy="150" rx="42" ry="25"/><ellipse cx="62" cy="159" rx="27" ry="17"/><rect x="56" y="153" width="108" height="21" rx="10.5"/></g>
</svg>
<div style="position:relative;z-index:1;padding:52px 24px 0;display:flex;align-items:center;gap:12px">
<div style="width:50px;height:50px;border-radius:16px;background:#fff;box-shadow:0 6px 18px rgba(4,24,42,.26);display:flex;align-items:center;justify-content:center">
<svg viewBox="0 0 44 44" width="30" height="30"><circle cx="22" cy="24" r="9" fill="#FFD166"/><path d="M6 30 h32" stroke="#0B72AE" stroke-width="3.4" stroke-linecap="round"/><path d="M10 36 h24" stroke="#37AEE2" stroke-width="3.4" stroke-linecap="round" opacity="0.6"/><path d="M22 8 v4 M33 12 l-2.6 2.8 M11 12 l2.6 2.8" stroke="#FFD166" stroke-width="2.6" stroke-linecap="round"/></svg>
</div>
<div>
<div style="font:800 21px/28px 'Baloo 2',sans-serif;color:#fff;line-height:28px">BlueRise</div>
<div style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:rgba(255,255,255,.78)">Học tập cùng con mỗi ngày</div>
</div>
</div>
</div>

<div style="flex:1;margin-top:-48px;border-radius:32px 32px 0 0;background:#fff;padding:24px 24px 24px;position:relative;z-index:2;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(6,62,98,.1)">
<div style="display:flex;gap:4px;margin-bottom:24px">
<span style="width:5px;height:5px;border-radius:4px;background:#0B72AE"></span>
<span style="width:22px;height:5px;border-radius:4px;background:#0B72AE"></span>
<span style="width:5px;height:5px;border-radius:4px;background:#DDEAF3"></span><span style="width:5px;height:5px;border-radius:4px;background:#DDEAF3"></span><span style="width:5px;height:5px;border-radius:4px;background:#DDEAF3"></span>
</div>
<div style="font:800 26px/32px 'Baloo 2',sans-serif;color:#0B3B58;line-height:32px">Đăng nhập</div>
<div style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488;margin-top:4px">Vui lòng nhập mật khẩu của SĐT <b style="color:#0B3B58;font-weight:700">09••• •• 789</b></div>

<div style="margin-top:24px">
<div style="font:700 13px/20px 'Be Vietnam Pro',sans-serif;color:#0B3B58;margin-bottom:8px">Mật khẩu</div>
<div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;border-radius:16px;border:2px solid #EF5B4C;background:#FFFAF9">
<span style="flex:1;font:700 17px/24px 'Be Vietnam Pro',sans-serif;color:#0B3B58;letter-spacing:3px">••••••••</span>
<i class="fa-regular fa-eye-slash" style="font-size:15px;color:#8AA3B4;line-height:1"></i>
</div>
<div style="display:flex;gap:8px;align-items:center;margin-top:8px">
<i class="fa-solid fa-circle-exclamation" style="font-size:13px;color:#D2453A;line-height:1"></i>
<div style="font:500 13px/20px 'Be Vietnam Pro',sans-serif;color:#D2453A">Sai tài khoản hoặc mật khẩu</div>
</div>
</div>

<div style="margin-top:24px;height:58px;border-radius:16px;background:#0B72AE;color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font:700 17px/24px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #085A8B,0 10px 22px rgba(11,114,174,.28);cursor:pointer" style-active="transform:translateY(4px);box-shadow:0 0 0 #085A8B">
<span style="width:17px;height:17px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:br-spin .8s linear infinite"></span>Đang kiểm tra
</div>

<div style="display:flex;gap:12px;margin-top:16px">
<div style="flex:1;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font:700 13px/20px 'Be Vietnam Pro',sans-serif;color:#5A7488;cursor:pointer">Đổi số điện thoại</div>
<div style="flex:1;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font:700 13px/20px 'Be Vietnam Pro',sans-serif;color:#0B72AE;cursor:pointer">Quên mật khẩu?</div>
</div>

<div style="margin-top:auto;display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:#F4FAFD">
<i class="fa-solid fa-shield-halved" style="font-size:15px;color:#0B72AE;line-height:1"></i>
<div style="font:500 11px/16px 'Be Vietnam Pro',sans-serif;color:#5A7488;flex:1">Lần sau bạn có thể đăng nhập nhanh bằng Face ID.</div>
</div>
</div>
</div>
</div>
<script>
(function(){
  var st = document.getElementById('stage');
  function fit(){ st.style.setProperty('--s', Math.min(innerWidth/430, innerHeight/932)); }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
})();
</script>
</body>
</html>
